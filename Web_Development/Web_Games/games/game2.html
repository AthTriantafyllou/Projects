<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega TicTacToe | Arcade</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="game-menu">

    <div class="menu-cab-label">◄ CAB · 02 ►</div>

    <h1>MEGA TIC-TAC-TOE</h1>

    <div class="menu-sub">BOARDS WITHIN BOARDS · 2 PLAYERS</div>

    <div class="menu-divider"></div>

    <div class="menu-buttons">
      <button id="localBtn">LOCAL PLAY</button>
      <button id="multiplayerBtn">ONLINE</button>
      <button id="howToPlayBtn">HOW TO PLAY</button>
      <button id="exitBtn">BACK TO ARCADE</button>
    </div>

    <div class="menu-footer">★ INSERT COIN TO CONTINUE ★</div>

  </main>

  <!-- Popup for Multiplayer -->
  <div id="popup" class="popup hidden">
    <div class="popup-content">
      <span class="close">&times;</span>
      <p>Online multiplayer is under development. Play local for now!</p>
    </div>
  </div>

  <script src="../js/game2.js"></script>
</body>
</html>
