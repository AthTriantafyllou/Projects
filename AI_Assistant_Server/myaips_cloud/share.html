<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shared Response</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      max-width: 800px;
      margin: auto;
      background: #f6f6f6;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
      line-height: 1.5;
    }

    .title {
      font-size: 24px;
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .error {
      color: red;
      font-size: 20px;
      text-align: center;
      padding-top: 30px;
    }

    /* Markdown Formatting */
    .box h1,
    .box h2,
    .box h3,
    .box h4 {
      margin-top: 24px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .box p {
      margin: 12px 0;
    }

    .box ul {
      padding-left: 24px;
      margin: 10px 0;
    }

    .box li {
      margin: 6px 0;
    }

    .box code {
      background: #eee;
      padding: 3px 6px;
      border-radius: 5px;
      font-family: monospace;
    }

    .box pre {
      background: #eee;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 16px 0;
    }
  </style>

  <!-- Load Markdown converter -->
  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>

</head>
<body>

  <div class="title">Shared Response</div>
  <div id="content">Loading...</div>

  <script>
    // Extract UUID from the URL path
    const parts = window.location.pathname.split("/");
    const shareId = parts[parts.length - 1];

    fetch(`/api/learn/share/${shareId}`)
      .then(res => {
        if (!res.ok) throw new Error("Not found");
        return res.json();
      })
      .then(data => {
        const converter = new showdown.Converter({
          tables: true,
          simplifiedAutoLink: true,
          strikethrough: true,
          tasklists: true
        });

        const html = converter.makeHtml(data.text);

        document.getElementById("content").innerHTML =
          '<div class="box">' + html + "</div>";
      })
      .catch(() => {
        document.getElementById("content").innerHTML =
          '<div class="error">Share not found.</div>';
      });
  </script>

</body>
</html>
